configuration:
  gateway_host:
    name: IP-adres van de gateway
    description: Bijvoorbeeld 192.168.178.160. Reserveer dit adres in je router.
  gateway_token:
    name: JWT-token
    description: Aan te maken op entrez.enphaseenergy.com, een jaar geldig.
  poll_interval:
    name: Verversen elke (seconden)
    description: Hoe vaak de gateway wordt uitgelezen. Standaard 5.
  inkoopvergoeding:
    name: Inkoopvergoeding (€/kWh, incl. btw)
    description: Staat in Mijn Vattenfall.
  energiebelasting:
    name: Energiebelasting (€/kWh, incl. btw)
    description: Verandert meestal op 1 januari.
  verkoopvergoeding:
    name: Verkoopvergoeding (€/kWh, incl. btw)
    description: Kosten per teruggeleverde kWh. Vul 0 in als Vattenfall die niet rekent.
  btw:
    name: Btw (%)
  saldering_tot:
    name: Saldering tot
    description: Datum waarop de saldering stopt (jjjj-mm-dd).
  vaste_leveringskosten_dag:
    name: Vaste leveringskosten (€/dag, incl. btw)
  netbeheer_dag:
    name: Netbeheerkosten (€/dag, incl. btw)
  vermindering_eb_dag:
    name: Vermindering energiebelasting (€/dag, incl. btw)
  accu_kwh:
    name: Batterijcapaciteit (kWh)
    description: Bruikbare capaciteit, voor het aantal cycli en het verlies. IQ Battery 5P = 5,0.
  demo:
    name: Demomodus
    description: Toont nepgegevens, om de app te bekijken zonder gateway.
network:
  8099/tcp: Web-app rechtstreeks (alleen voor toegang zonder Home Assistant)
