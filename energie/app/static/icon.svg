<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
<!-- App-icoon Veerman Home: glazen huis met de zon erachter (eigen ontwerp) -->
<defs>
  <radialGradient id="ibg" cx="50%" cy="38%" r="75%"><stop offset="0" stop-color="#3A2416"/><stop offset="1" stop-color="#120C08"/></radialGradient>
  <radialGradient id="igloed" cx="50%" cy="50%" r="50%"><stop offset="0" stop-color="#FF8A2A" stop-opacity="0.85"/><stop offset="0.55" stop-color="#FF6A00" stop-opacity="0.28"/><stop offset="1" stop-color="#FF6A00" stop-opacity="0"/></radialGradient>
  <linearGradient id="iglas" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#FFFFFF" stop-opacity="0.34"/><stop offset="1" stop-color="#FFFFFF" stop-opacity="0.06"/></linearGradient>
  <linearGradient id="irand" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#FFFFFF" stop-opacity="0.8"/><stop offset="1" stop-color="#FFFFFF" stop-opacity="0.15"/></linearGradient>
  <linearGradient id="ioranje" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#FFB45E"/><stop offset="1" stop-color="#FF6A00"/></linearGradient>
  <filter id="iblur" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="18"/></filter>
  <filter id="ivaag" x="-20%" y="-20%" width="140%" height="140%"><feGaussianBlur stdDeviation="6"/></filter>
  <clipPath id="itegel"><rect width="512" height="512" rx="114"/></clipPath>
</defs>
<rect width="512" height="512" rx="114" fill="url(#ibg)"/><g clip-path="url(#itegel)">
  <circle cx="256" cy="300" r="230" fill="url(#igloed)"/>
  <circle cx="340" cy="168" r="78" fill="#FF6A00" filter="url(#iblur)" opacity="0.6"/>
  <circle cx="340" cy="168" r="78" fill="url(#ioranje)"/>
  <!-- de zon schemert door het glas -->
  <g clip-path="url(#ihuis)"><circle cx="340" cy="168" r="78" fill="#FFB45E" filter="url(#ivaag)" opacity="0.35"/></g>
  <clipPath id="ihuis"><polygon points="136,252 256,146 376,252 376,388 136,388"/></clipPath>
  <polygon points="136,252 256,146 376,252 376,388 136,388" fill="url(#iglas)" stroke="url(#irand)" stroke-width="5" stroke-linejoin="round"/>
  <path d="M150 252 L256 158 L362 252" fill="none" stroke="#FFFFFF" stroke-opacity="0.55" stroke-width="4" stroke-linejoin="round"/>
</g>
</svg>
