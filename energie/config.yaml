name: Veerman Home
version: "1.1.0"
slug: veerman_enphase
description: Eén app voor je huis - energie (Enphase en Vattenfall-prijzen), klimaat, licht en zonwering
url: https://github.com/veermanp0706/Veerman-home
arch:
  - aarch64
  - amd64
  - armv7
init: false
startup: application
boot: auto
ingress: true
ingress_port: 8099
panel_icon: mdi:home-lightning-bolt-outline
panel_title: Thuis
panel_admin: false
homeassistant_api: true
ports:
  8099/tcp: null
ports_description:
  8099/tcp: Web-app rechtstreeks (alleen nodig voor toegang zonder Home Assistant, bijvoorbeeld via Tailscale)
options:
  gateway_host: ""
  gateway_token: ""
  poll_interval: 5
  inkoopvergoeding: 0.015
  energiebelasting: 0.110848
  verkoopvergoeding: 0.0
  btw: 21
  saldering_tot: "2027-01-01"
  vaste_leveringskosten_dag: 0.196915
  netbeheer_dag: 1.309704
  vermindering_eb_dag: 1.723173
  accu_kwh: 5.0
  historie_uit_ha: true
  demo: false
schema:
  gateway_host: str
  gateway_token: password
  poll_interval: int(2,60)
  inkoopvergoeding: float
  energiebelasting: float
  verkoopvergoeding: float
  btw: int(0,100)
  saldering_tot: match(^\d{4}-\d{2}-\d{2}$)
  vaste_leveringskosten_dag: float
  netbeheer_dag: float
  vermindering_eb_dag: float
  accu_kwh: float
  historie_uit_ha: bool
  demo: bool
